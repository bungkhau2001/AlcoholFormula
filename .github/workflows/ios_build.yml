name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project AlcoholFormula.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AlcoholFormula.xcodeproj \
            -scheme AlcoholFormula \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlcoholFormula-Simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/AlcoholFormula.app
          retention-days: 7
