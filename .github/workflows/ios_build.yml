name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hien thi Xcode san co (khong can setup them)
      - name: Show Xcode info
        run: |
          ls /Applications/ | grep Xcode || true
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 1[2-9]|iPhone 2" | head -10

      - name: List schemes
        run: xcodebuild -project AlcoholFormula.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AlcoholFormula.xcodeproj \
            -scheme AlcoholFormula \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlcoholFormula-Simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/AlcoholFormula.app
          retention-days: 7
