name: Build iOS App (Simulator)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # Cho phep chay thu cong

jobs:
  build:
    name: Build & Test on macOS
    runs-on: macos-15   # macOS 15 = Xcode 16, ho tro iOS 17+

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Chon Xcode version (16.x ho tro iOS 17+)
      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      # 3. Hien thi thong tin SDK
      - name: Show available simulators
        run: xcrun simctl list devices available --json | python3 -c "
import json,sys
d=json.load(sys.stdin)
iphones=[v for k,vals in d.get('devices',{}).items() if 'iOS-17' in k or 'iOS-18' in k for v in vals]
[print(i['name'], i.get('udid','')) for i in iphones[:5]]
"

      # 4. Build cho iOS Simulator (khong can sign)
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AlcoholFormula.xcodeproj \
            -scheme AlcoholFormula \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build \
            | xcpretty --color || xcodebuild \
              -project AlcoholFormula.xcodeproj \
              -scheme AlcoholFormula \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build

      # 5. Archive build artifacts (optional)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlcoholFormula-Debug
          path: ~/Library/Developer/Xcode/DerivedData/AlcoholFormula*/Build/Products/Debug-iphonesimulator/AlcoholFormula.app
          retention-days: 7

      # 6. Thong bao ket qua
      - name: Build Success
        if: success()
        run: echo "BUILD THANH CONG! App da duoc build cho iOS Simulator."

      - name: Build Failed
        if: failure()
        run: echo "BUILD THAT BAI! Xem log phia tren de debug."
