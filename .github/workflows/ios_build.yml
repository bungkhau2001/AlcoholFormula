name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Build for iOS Simulator (test)
        run: |
          xcodebuild \
            -project AlcoholFormula.xcodeproj \
            -scheme AlcoholFormula \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build 2>&1 | tail -20

      - name: Build unsigned IPA for real device
        run: |
          xcodebuild \
            -project AlcoholFormula.xcodeproj \
            -scheme AlcoholFormula \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            clean build \
            -derivedDataPath build/DerivedData 2>&1 | tail -30

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/DerivedData/Build/Products/Release-iphoneos/AlcoholFormula.app" build/Payload/
          cd build && zip -r AlcoholFormula.ipa Payload/
          echo "IPA size: "

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlcoholFormula-IPA
          path: build/AlcoholFormula.ipa
          retention-days: 14
