name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-14        # macos-14 (Apple Silicon) co san hon macos-15
    timeout-minutes: 30      # Tu dong huy neu qua 30 phut

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'   # Version cu hon, de tim runner hon

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project AlcoholFormula.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AlcoholFormula.xcodeproj \
            -scheme AlcoholFormula \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlcoholFormula-Simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/AlcoholFormula.app
          retention-days: 7
